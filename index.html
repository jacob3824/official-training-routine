<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b"><title>Official Training Routine</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{color-scheme:dark;--bg:#0b0b0b;--card:#171717;--muted:#a3a3a3;--text:#fff;--accent:#d32f2f;--border:#303030;--ok:#22c55e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:18px 14px 110px}h1{font-size:28px;margin:4px 0}.sub{color:var(--muted);margin-bottom:18px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;position:sticky;top:0;background:rgba(11,11,11,.96);padding:10px 0;z-index:5}.tab{border:1px solid var(--border);background:var(--card);color:#fff;padding:11px 6px;border-radius:12px;font-weight:700}.tab.active{background:var(--accent);border-color:var(--accent)}.weekline{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin:12px 0}.exercise{font-weight:800;font-size:18px;margin-bottom:10px}.setrow{display:grid;grid-template-columns:48px 1fr 1fr 48px;gap:8px;align-items:end;margin:8px 0}label{font-size:12px;color:var(--muted)}input,textarea,select{width:100%;background:#0f0f0f;color:#fff;border:1px solid var(--border);border-radius:10px;padding:12px;font-size:17px}textarea{min-height:78px;resize:vertical}.setnum{font-weight:800;text-align:center;padding-bottom:12px}.done{display:flex;align-items:center;justify-content:center}.done input{width:24px;height:24px}.actions{display:flex;gap:10px;margin-top:16px}button.primary,button.secondary{flex:1;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:800}.primary{background:var(--accent);color:#fff}.secondary{background:#262626;color:#fff;border:1px solid var(--border)!important}.saved{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#181818;border:1px solid var(--border);padding:10px 14px;border-radius:999px;color:var(--ok);font-weight:700;opacity:0;transition:.2s}.saved.show{opacity:1}@media(max-width:520px){h1{font-size:24px}.tabs{grid-template-columns:repeat(2,1fr)}.setrow{grid-template-columns:42px 1fr 1fr 42px}}
</style></head>
<body><div class="wrap"><h1>💪 Official Training Routine</h1><div class="sub">Train. Progress. Dominate.</div>
<div class="weekline"><label>Semaine<select id="week"></select></label><label>Poids corporel (lb)<input id="bodyweight" inputmode="decimal" placeholder="ex. 223.4"></label></div>
<div class="tabs" id="tabs"></div><div id="workout"></div>
<div class="card"><div class="exercise">Notes de séance</div><textarea id="notes" placeholder="Énergie, douleurs, PR, technique, etc."></textarea></div>
<div class="actions"><button class="secondary" id="copyPrev">Copier la semaine précédente</button><button class="primary" id="finish">Terminer la séance</button></div></div><div id="saved" class="saved">✓ Sauvegardé</div>
<script>
const plan=[{name:"Chest / Mollets / Trapèzes",exercises:[["Bench Press Incline",4,"10–12"],["Dumbbell Flat Press",4,"10–12"],["Standing Cable Fly",5,"12–15"],["Pec Deck",5,"12–15"],["DB Shrugs",5,"12–15"],["Standing Calf Raise",4,""],["Standing Calf Smith Machine",3,""]]},{name:"Épaules / Triceps",exercises:[["Barbell Overhead Press",4,"10–12"],["Lateral Raise Dumbbell",4,"10–15"],["Lateral Raise Cable",3,""],["Rear Delt Cable",3,""],["Rear Delt Pec Deck",3,"8–12"],["Rope Pushdown",4,"12–15"],["Dips",3,"10–12"],["Reverse Pushdown",4,""],["Phil Heath 1-Arm Pushdown",4,"12–15"]]},{name:"Dos / Biceps",exercises:[["Dumbbell Row",4,"8–12"],["Barbell Row",3,"8–12"],["Pulldown Cable",3,"10–15"],["Dumbbell Curl",3,"10–12"],["Seated Dumbbell Curl",3,"10–12"],["Cable Curl",3,""],["Hammer Curl Cable",3,"8–12"]]},{name:"Jambes / Mollets",exercises:[["Leg Exercise 1",4,""],["Leg Exercise 2",4,""],["Leg Exercise 3",3,""],["Standing Calf Raise",4,""]]}];
let day=0;const weekSel=document.getElementById('week');for(let i=1;i<=12;i++){let o=document.createElement('option');o.value=i;o.textContent='Semaine '+i;weekSel.appendChild(o)}const tabs=document.getElementById('tabs'),workout=document.getElementById('workout'),bodyweight=document.getElementById('bodyweight'),notes=document.getElementById('notes'),saved=document.getElementById('saved');
const key=()=>`otr-w${weekSel.value}-d${day}`;const getData=()=>JSON.parse(localStorage.getItem(key())||'{"sets":{},"bodyweight":"","notes":""}');function saveData(d){localStorage.setItem(key(),JSON.stringify(d));saved.classList.add('show');setTimeout(()=>saved.classList.remove('show'),700)}
function renderTabs(){tabs.innerHTML='';plan.forEach((d,i)=>{let b=document.createElement('button');b.className='tab'+(i===day?' active':'');b.textContent='Jour '+(i+1);b.addEventListener('click',()=>{day=i;render()});tabs.appendChild(b)})}
function render(){renderTabs();const data=getData();bodyweight.value=data.bodyweight||'';notes.value=data.notes||'';workout.innerHTML='';plan[day].exercises.forEach((ex,ei)=>{let card=document.createElement('div');card.className='card';card.innerHTML=`<div class="exercise">${ex[0]} <span style="color:var(--muted);font-size:14px">(${ex[1]} séries${ex[2]?' • '+ex[2]+' reps':''})</span></div>`;for(let s=1;s<=ex[1];s++){let id=`e${ei}s${s}`,val=data.sets[id]||{},row=document.createElement('div');row.className='setrow';row.innerHTML=`<div class="setnum">S${s}</div><label>Poids (lb)<input inputmode="decimal" data-id="${id}" data-field="weight" value="${val.weight||''}"></label><label>Reps<input inputmode="numeric" data-id="${id}" data-field="reps" value="${val.reps||''}"></label><label class="done"><input type="checkbox" data-id="${id}" data-field="done" ${val.done?'checked':''}></label>`;card.appendChild(row)}workout.appendChild(card)});workout.querySelectorAll('input').forEach(inp=>inp.addEventListener('input',()=>{let d=getData(),id=inp.dataset.id;d.sets[id]=d.sets[id]||{};d.sets[id][inp.dataset.field]=inp.type==='checkbox'?inp.checked:inp.value;saveData(d)}))}
bodyweight.addEventListener('input',()=>{let d=getData();d.bodyweight=bodyweight.value;saveData(d)});notes.addEventListener('input',()=>{let d=getData();d.notes=notes.value;saveData(d)});weekSel.addEventListener('change',render);document.getElementById('copyPrev').addEventListener('click',()=>{let w=Number(weekSel.value);if(w<=1){alert('Tu es déjà à la semaine 1.');return}let prev=localStorage.getItem(`otr-w${w-1}-d${day}`);if(!prev){alert('Aucune donnée trouvée dans la semaine précédente.');return}localStorage.setItem(key(),prev);render();saveData(getData())});document.getElementById('finish').addEventListener('click',()=>{let d=getData();d.finishedAt=new Date().toISOString();saveData(d);alert('Séance sauvegardée 💪')});if('serviceWorker'in navigator){navigator.serviceWorker.register('sw.js')}render();
</script></body></html>
